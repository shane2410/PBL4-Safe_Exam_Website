# ==============================================================================
# Cấu hình Nginx Reverse Proxy - Hệ thống Thi trắc nghiệm trực tuyến An toàn
# ==============================================================================

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Cho phép tải lên file ngân hàng câu hỏi (.docx, hình ảnh) lên tới 10MB
    client_max_body_size 10M;

    # Nén Gzip tối ưu băng thông và tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # --- 1. Frontend SPA tĩnh ---
    root /usr/share/nginx/html;
    index index.html;

    # Cấu hình cache cho tài nguyên tĩnh được băm theo tên file (Vite build)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Hỗ trợ Client-side Routing (Single Page Application):
    # Mọi đường dẫn không khớp với file thực tế đều fallback về /index.html
    # Quan trọng: Ngăn ngừa lỗi 404 khi thí sinh hoặc giám thị F5 trang thi/giám sát
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 2. Proxy REST API ---
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Truyền đúng thông tin client và host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho các tác vụ xử lý báo cáo, import file câu hỏi lớn
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- 3. Proxy Socket.IO WebSocket ---
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # BẮT BUỘC: Upgrade WebSocket handshake
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình chống ngắt kết nối WebSocket giữa chừng:
        # Heartbeat client-server là 10s, timeout server 30s.
        # Đặt 120s để không làm ngắt phiên thi khi mạng chập chờn
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Trang lỗi tùy chỉnh (tùy chọn)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
